name = "Lean4"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Lean4", "Blowup"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[lean_lib]]
name = "Lean4"

[[lean_lib]]
name = "Blowup"
roots = ["Blowup", "BlowupGeometry", "BlowupProjective", "BlowupStrict", "BlowupClosure"]

